# AACNet 盲元补完网络 - 真实图像续训配置文件
# 用法: python main.py --train --config_path ./experiment_real.cfg

# ============================================================
# 数据集配置
# ============================================================
[dataset]
data_root = ./real_image
train_blur_dir = train_blur
train_sharp_dir = train_sharp
train_mask_dir = train_mask
val_blur_dir = val_blur
val_sharp_dir = val_sharp
val_mask_dir = val_mask
test_blur_dir = test_blur
test_sharp_dir = test_sharp
test_mask_dir = test_mask

# 图像尺寸（固定）
image_width = 640
image_height = 512

# 数据预处理
enable_augmentation = True
flip_prob = 0.5
rotation_angle = 10

# ============================================================
# 训练配置
# ============================================================
[training]
num_epochs = 225
batch_size = 4
learning_rate = 0.0001
lr_schedule = cosine
eta_min = 0.0000001
# niter = 225: 从 epoch 125 续训 100 轮 (175 + 50)
niter = 225
niter_decay = 0
lr_decay_factor = 0.995
val_interval = 5
num_workers = 8

# ============================================================
# 检查点保存配置
# ============================================================
[checkpoint]
# 续训模型保存到 experiments_real
checkpoints_dir = ./experiments_real/models
name = aacnet_blind_real
model_prefix = best_model
save_epoch_freq = 1
best_metric = psnr

# ============================================================
# 日志和显示配置
# ============================================================
[logging]
log_dir = ./experiments_real/logs
print_freq = 10
save_val_visual = False
val_visual_dir = ./experiments_real/val_results

# ============================================================
# 设备配置
# ============================================================
[device]
gpu_ids = 0
use_dataparallel = False
mixed_precision = True

# ============================================================
# 测试配置
# ============================================================
[testing]
results_dir = ./results_real

# ============================================================
# 盲元特定配置
# ============================================================
[blind_pixel]
compute_blind_metrics = True
mask_type = both
static_coords_file = blind_pixel_coords.csv
dynamic_coords_file = flash_pixel_coords.csv

# ============================================================
# 恢复训练配置 — 从仿真预训练模型续训
# ============================================================
[resume]
resume_training = True
# 留空则自动从当前实验目录的 best_model.pt 续训；首次训练时手动指定仿真预训练模型路径
checkpoint_path =
load_weights_only = False
