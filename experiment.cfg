# AACNet 盲元补完网络 - 实验配置文件
# 用法: python main.py --train --config_path ./experiment.cfg
#      python main.py --test --config_path ./experiment.cfg

# ============================================================
# 数据集配置
# ============================================================
[dataset]
data_root = ./data
train_blur_dir = train_blur
train_sharp_dir = train_sharp
train_mask_dir = train_mask
val_blur_dir = val_blur
val_sharp_dir = val_sharp
val_mask_dir = val_mask
test_blur_dir = test_blur
test_sharp_dir = test_sharp
test_mask_dir = test_mask

# 图像尺寸（固定）
image_width = 640
image_height = 512

# 数据预处理
# 是否进行数据增强（仅训练集）
enable_augmentation = True
# 翻转概率
flip_prob = 0.5
# 旋转角度范围
rotation_angle = 10

# ============================================================
# 训练配置
# ============================================================
[training]
# 训练轮数
num_epochs = 100
# 批次大小
batch_size = 2
# 学习率
learning_rate = 0.0001
# 学习率衰减策略
lr_schedule = exponential
# 学习率衰减参数
lr_decay_factor = 0.99
# 验证间隔（每多少轮验证一次）
val_interval = 20
# 数据加载线程数
num_workers = 8
# 是否洗牌数据集
shuffle = True

# ============================================================
# 优化器配置
# ============================================================
[optimizer]
# 优化器类型: adam, sgd
optimizer_type = adam
# Adam参数
adam_beta1 = 0.5
adam_beta2 = 0.9
adam_weight_decay = 0
# SGD参数
sgd_momentum = 0.9

# ============================================================
# 损失函数配置
# ============================================================
[loss]
# 重建损失权重
lambda_l1 = 1.0
# 感知损失权重
lambda_perceptual = 1.0
# 风格损失权重
lambda_style = 250.0
# 对抗损失权重
lambda_adv = 0.1
# 一致性损失权重
lambda_consist = 1.0

# ============================================================
# 模型配置
# ============================================================
[model]
# 模型名称
model_name = aacnet
# 生成器基础通道数
generator_ngf = 48
# 判别器基础通道数
discriminator_ndf = 64
# 输入通道数（RGB为3）
in_channels = 3
# 输出通道数（RGB为3）
out_channels = 3

# ============================================================
# 测试配置
# ============================================================
[testing]
# 批次大小
batch_size = 1
# 数据加载线程数
num_workers = 4
# 是否计算PSNR/SSIM
compute_metrics = True
# PSNR/SSIM计算的边界裁剪像素
crop_border = 0
# 是否保存补完结果
save_results = True
# 结果保存目录
results_dir = ./results

# ============================================================
# 检查点和保存配置
# ============================================================
[checkpoint]
# 检查点保存目录
checkpoint_dir = ./checkpoints
# 模型命名前缀
model_prefix = best_model
# 每隔多少轮保存临时检查点（0表示不保存）
save_interval = 0
# 只保存最好的模型（基于PSNR）
save_best_only = True
# 用于评估的指标: psnr, ssim, loss
best_metric = psnr

# ============================================================
# 日志和显示配置
# ============================================================
[logging]
# 日志保存目录
log_dir = ./logs
# 每隔多少个batch打印一次日志
print_freq = 10
# 是否保存验证可视化结果
save_val_visual = True
# 验证结果保存目录
val_visual_dir = ./val_results

# ============================================================
# 设备配置
# ============================================================
[device]
# GPU IDs (e.g., "0,1,2" for multiple GPUs)
gpu_ids = 0
# 是否使用DataParallel
use_dataparallel = False
# 混合精度训练
mixed_precision = False

# ============================================================
# 盲元特定配置
# ============================================================
[blind_pixel]
# 盲元指标计算
compute_blind_metrics = True
# 盲元掩码类型: csv, image, both
mask_type = both
# 静态盲元坐标CSV文件名
static_coords_file = blind_coords.csv
# 动态盲元坐标CSV文件名
dynamic_coords_file = flash_pixel_coords.csv

# ============================================================
# 恢复训练配置
# ============================================================
[resume]
# 是否从检查点恢复训练
resume_training = False
# 检查点路径（如果为空，自动寻找最新的）
checkpoint_path = 
# 是否只加载模型权重（不恢复optimizer和epoch）
load_weights_only = False

# ============================================================
# 随机种子
# ============================================================
[misc]
# 随机种子（设置为-1以使用系统时间）
seed = 42
# 是否启用cudnn确定性模式
deterministic = False
# 是否启用cudnn自动优化
cudnn_benchmark = True
