# AACNet 盲元补完网络 - 实验配置文件
# 用法: python main.py --train --config_path ./experiment.cfg
#      python main.py --test --config_path ./experiment.cfg

# ============================================================
# 数据集配置
# ============================================================
[dataset]
data_root = /home/student_server/Qtt/NAFNet/data
train_blur_dir = train_blur
train_sharp_dir = train_sharp
train_mask_dir = train_mask
val_blur_dir = val_blur
val_sharp_dir = val_sharp
val_mask_dir = val_mask
test_blur_dir = test_blur
test_sharp_dir = test_sharp
test_mask_dir = test_mask

# 图像尺寸（固定）
image_width = 640
image_height = 512

# 数据预处理
# 是否进行数据增强（仅训练集）
enable_augmentation = True
# 翻转概率
flip_prob = 0.5
# 旋转角度范围
rotation_angle = 10

# ============================================================
# 训练配置
# ============================================================
[training]
# 训练轮数
num_epochs = 400
# 批次大小
batch_size = 4
# 学习率
learning_rate = 0.0001
# 学习率策略: lambda / step / exponent / cosine
lr_schedule = cosine
# 余弦退火最低学习率（仅在 lr_schedule=cosine 时生效）
eta_min = 0.000001
# 余弦退火周期参数（可选，默认回退到 num_epochs）
niter = 400
niter_decay = 0
# 学习率衰减参数（仅在 lr_schedule=exponent 时生效）
lr_decay_factor = 0.995
# 验证间隔（每多少轮验证一次）
val_interval = 5
# 数据加载线程数
num_workers = 8

# ============================================================
# 检查点保存配置
# ============================================================
[checkpoint]
# 检查点保存根目录（所有模型文件都保存在这里）
checkpoints_dir = ./experiments/models
# 实验名称（将作为子目录名）
name = aacnet_blind
# 每隔多少个epoch保存一次历史模型
save_epoch_freq = 50
# 筛选最佳模型的指标类型: psnr, ssim, mae
best_metric = psnr

# ============================================================
# 日志和显示配置
# ============================================================
[logging]
# 日志保存目录（训练日志与验证日志都保存在这里）
log_dir = ./experiments/logs
# 训练日志与验证日志分开保存；每隔多少个batch打印一次训练日志
print_freq = 10
# 是否保存验证可视化结果
save_val_visual = False
# 验证结果保存目录
val_visual_dir = ./experiments/val_results

# ============================================================
# 设备配置
# ============================================================
[device]
# GPU IDs (e.g., "0,1,2" for multiple GPUs)（优化后：多卡并行，解禁双3090算力）
gpu_ids = 0,1
# 是否使用DataParallel（优化后：多卡并行开关）
use_dataparallel = True
# 混合精度训练（优化后：大幅节省显存并加速训练）
mixed_precision = True

# ============================================================
# 盲元特定配置
# ============================================================
[blind_pixel]
# 盲元指标计算
compute_blind_metrics = True
# 盲元掩码类型: csv, image, both
mask_type = both
# 静态盲元坐标CSV文件名
static_coords_file = blind_coords.csv
# 动态盲元坐标CSV文件名
dynamic_coords_file = flash_pixel_coords.csv

# ============================================================
# 恢复训练配置
# ============================================================
[resume]
# 是否从检查点恢复训练
resume_training = False
# 检查点路径（如果为空，自动寻找最新的 best_model.pt）
checkpoint_path = 
# 是否只加载模型权重（不恢复optimizer和epoch）；False 时可用于完整续训
load_weights_only = False